name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Validate release metadata and signing secrets
        env:
          VCP_KEYSTORE_BASE64: ${{ secrets.VCP_KEYSTORE_BASE64 }}
          VCP_RELEASE_STORE_PASSWORD: ${{ secrets.VCP_RELEASE_STORE_PASSWORD }}
          VCP_RELEASE_KEY_ALIAS: ${{ secrets.VCP_RELEASE_KEY_ALIAS }}
          VCP_RELEASE_KEY_PASSWORD: ${{ secrets.VCP_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^vcp\.versionName=//p' gradle.properties)"
          version_code="$(sed -n 's/^vcp\.versionCode=//p' gradle.properties)"
          test -n "$version_name"
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_REF_NAME" = "v$version_name"
          grep -Fq "## [$version_name]" CHANGELOG.md

          for variable in VCP_KEYSTORE_BASE64 VCP_RELEASE_STORE_PASSWORD VCP_RELEASE_KEY_ALIAS VCP_RELEASE_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required release secret: $variable" >&2
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/vcp-release.jks"
          printf '%s' "$VCP_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          printf 'VCP_RELEASE_STORE_FILE=%s\n' "$keystore_path" >> "$GITHUB_ENV"

      - name: Test, lint, and build signed artifacts
        env:
          VCP_RELEASE_STORE_PASSWORD: ${{ secrets.VCP_RELEASE_STORE_PASSWORD }}
          VCP_RELEASE_KEY_ALIAS: ${{ secrets.VCP_RELEASE_KEY_ALIAS }}
          VCP_RELEASE_KEY_PASSWORD: ${{ secrets.VCP_RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease

      - name: Verify signatures and package release files
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^vcp\.versionName=//p' gradle.properties)"
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"

          test -f "$apk"
          test -f "$aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          jarsigner -verify "$aab"

          mkdir -p dist
          cp "$apk" "dist/vcp-$version_name.apk"
          cp "$aab" "dist/vcp-$version_name.aab"
          cd dist
          sha256sum "vcp-$version_name.apk" "vcp-$version_name.aab" > SHA256SUMS.txt

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^vcp\.versionName=//p' gradle.properties)"
          flags=(--draft)
          if [[ "$version_name" == *-* ]]; then
            flags+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            "dist/vcp-$version_name.apk" \
            "dist/vcp-$version_name.aab" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --generate-notes \
            --title ".vcp $version_name" \
            "${flags[@]}"
