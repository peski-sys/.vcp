name: Bug report
description: Report reproducible incorrect behavior in .vcp
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not upload private videos, location data, or unredacted media reports. Use a self-created test clip when a sample is necessary.

  - type: input
    id: app-version
    attributes:
      label: .vcp version
      placeholder: 0.4.0-alpha01
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Android device and OS version
      placeholder: Pixel 10, Android 17
    validations:
      required: true

  - type: input
    id: gallery
    attributes:
      label: Gallery app and version
      placeholder: Google Photos version shown in App info
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Source and transfer details
      description: Recording device, camera format/HDR setting, resolution/frame rate, and transfer method.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that causes the problem.
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private filenames, paths, location data, identifiers, and personal media.
          required: true
